<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>搜索关键词英译</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="badge" aria-hidden="true">中 → EN</div>
  <h1>搜索关键词英译</h1>
  <p>在 Google 或 Google Scholar 的网页搜索框中输入中文，然后按：</p>
  <div class="shortcut"><kbd>Ctrl</kbd><span>+</span><kbd>'</kbd></div>
  <p>译文会直接填入搜索框，按回车即可搜索。右下角提示中可恢复中文。</p>
  <p class="note">Mac 使用 Control 键。单引号是英文键盘上回车左侧的按键。安装后请刷新已打开的搜索页面。</p>
  <footer>无需 API Key · 需要联网<br>仅在触发快捷键时，将关键词发送至 Google 翻译。</footer>
</body>
</html>
